# ============================================================
# CI/CD Workflow with Security + Non-Blocking Scans + Deployment
# ============================================================

name: CI/CD - Build, Scan & Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

jobs:

# ============================================================
# STAGE 1: PRE-BUILD SECURITY
# ============================================================

  pre-build-security:
    name: 🔒 Pre-Build Security Checks
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: GitLeaks Scan (Non-blocking)
        run: |
          echo "🔑 Running GitLeaks..."
          gitleaks detect --source . --verbose --exit-code 0 || true
          
      - name: ESLint Scan (Node)
        run: |
          if [ -d result ]; then
            cd result
            npm install --silent || true
            npm install eslint eslint-plugin-security --silent || true

# ============================================================
# STAGE 2: BUILD & SCAN VOTE
# ============================================================

# ============================================================
# CI/CD Workflow with Security + Non-Blocking Scans + Deployment
# ============================================================

name: CI/CD - Build, Scan & Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

jobs:

# ============================================================
# STAGE 1: PRE-BUILD SECURITY
# ============================================================

  pre-build-security:
    name: 🔒 Pre-Build Security Checks
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: GitLeaks Scan (Non-blocking)
        run: |
          echo "🔑 Running GitLeaks..."
          gitleaks detect --source . --verbose --exit-code 0 || true
          
      - name: ESLint Scan (Node)
        run: |
          if [ -d result ]; then
            cd result
            npm install --silent || true
            npm install eslint eslint-plugin-security --silent || true

# ============================================================
# STAGE 2: BUILD & SCAN VOTE
# ============================================================

   build-vote:
    runs-on: self-hosted
    needs: pre-build-security

    steps:
      - uses: actions/checkout@v4

      - name: Build Vote Image
        run: docker build -t vote-app:appv1 ./vote

      - name: Trivy Scan (Non-blocking)
        run: |
          trivy image --severity HIGH,CRITICAL --exit-code 0 vote-app:appv1 || true

      - name: Snyk Scan
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            snyk auth $SNYK_TOKEN
            snyk container test vote-app:appv1 || true
          fi

