# ============================================================
# CI/CD Workflow with Security + Non-Blocking Scans + Deployment
# ============================================================

name: CI/CD - Build, Scan & Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

jobs:

# ============================================================
# STAGE 1: PRE-BUILD SECURITY
# ============================================================

  pre-build-security:
    name: 🔒 Pre-Build Security Checks
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: GitLeaks Scan 
        run: |
          echo " Running GitLeaks..."
          gitleaks detect --source . --verbose --exit-code 0 || true
          
      - name: ESLint Scan (Node)
        run: |
          if [ -d result ]; then
            cd result
            npm install --silent || true
            npm install eslint eslint-plugin-security --silent || true

            echo '{ "plugins": ["security"], "extends": ["plugin:security/recommended"] }' > .eslintrc.json

            npx eslint . || true
            cd ..
          fi


# ==================================================================================================
# STAGE 2: BUILD SCAN VOTE
# ==================================================================================================

  build-vote:
    runs-on: self-hosted
    needs: pre-build-security

    steps:
      - uses: actions/checkout@v4 
      - name: " current directory "
        run: |  
          echo "Current directory:"
          pwd
          echo "Contents of vote folder:"
          ls -la vote
      
      
      - name: build vote images
        run: | 
          docker build \
            -f vote/templates/Dockerfile \
            -t vote-app:appv1 \
            ./vote/templates
          

      - name: trivy scan continue-on-error
        run: |
          trivy images --severity HIGH, CRITICAL --exit-code 0 vote-app:appv1 || true

      - name: synk scan
        run: | 
          if [ -n "$SNYK_TOKEN" }; then
            synk auth $SNYK_TOKEN
            synk container test vote-app:appv1 || true
          fi

# ===================================================================================
# STAGE 3: BUILD SCAN RESULT
# ====================================================================================

  build-result:
    runs-on: self-hosted
    needs: pre-build-security

    steps:
      - uses: actions/checkout@v4

      - name: build result image
        run: |
          docker build \
            -f result/views/stylesheets/Dockerfile \
            -t result-app:appv1 \
            ./result/views/stylesheets
            
      - name: trivy scan  non blocking
        run: |
          trivy images --severity HIGH,CRITICAL --exit-code 0 result-app:appv1 || true

      - name: npm audit (non blocking)
        run: |
          cd result
          npm install --silient || true
          npm audit || true
          cd ..

#==========================================================
# STAGE 4: BUILD SCAN WORKER
# =======================================================

  build-worker:
    runs-on: self-hosted
    needs: pre-build-security

    steps:
      - uses: actions/checkout@v4

      - name: build worker images
        run: docker build -t worker-app:appv1 ./worker

      - name: trivy scan continue
        run: |
          trivy image --severity HIGH CRITICAL --exit-code 0 worker-app:appv1 || true
      
          
  
  
         

